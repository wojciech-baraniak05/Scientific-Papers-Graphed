services:
  backend:
    volumes:
      - ./app:/app/app
      - ./sql:/app/sql
    command:
      - uvicorn
      - app.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

  frontend:
    volumes:
      - ./app/frontend:/app/app/frontend
    environment:
      API_BASE_URL: http://backend:8000
    command:
      - streamlit
      - run
      - app/frontend/streamlit_app.py
      - --server.port
      - "8501"
      - --server.address
      - "0.0.0.0"
      - --server.headless
      - "true"
      - --server.runOnSave
      - "true"
