services:
  mysql:
    image: mysql:8.0
    container_name: papers-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-papers}
      MYSQL_USER: ${MYSQL_USER:-papers}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-paperspass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-allowed-packet=64M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: papers-backend
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: papers-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
      API_DOCS_URL: http://localhost:${BACKEND_PORT:-8000}/docs
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      - backend

volumes:
  mysql_data:
    name: papers_mysql_data
